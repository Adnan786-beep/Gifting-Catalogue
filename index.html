<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Gifting Catalogue</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-amber-400 tracking-wide">GIFTING CATALOGUE</h1>
                <p class="text-[10px] sm:text-xs text-gray-300">Corporate & Executive Gifts</p>
            </div>
            
            <!-- Cart Button -->
            <button onclick="toggleCart()" class="relative bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg flex items-center gap-1.5 sm:gap-2 transition text-xs sm:text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />
                </svg>
                <span>Cart</span>
                <span id="cart-count" class="bg-slate-900 text-amber-400 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Controls Bar: Search & Category Filter -->
    <div class="bg-white border-b sticky top-[57px] sm:top-[65px] z-20 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-2.5 flex flex-col sm:flex-row gap-2 sm:gap-3 justify-between items-center">
            <!-- Search Box -->
            <div class="w-full sm:w-72">
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search product or code..." class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            
            <!-- Filter Tabs -->
            <div id="category-tabs" class="flex gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 text-xs no-scrollbar">
                <!-- Dynamically rendered by script.js -->
            </div>
        </div>
    </div>

    <!-- Product Grid -->
    <main class="max-w-6xl mx-auto px-4 py-4 sm:py-6 flex-grow w-full">
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
            <!-- Dynamically rendered by script.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-gray-400 text-center py-4 text-xs mt-auto">
        <p>Tap any product image to open options & send inquiry on WhatsApp.</p>
    </footer>

    <!-- Overlay Backdrop -->
    <div id="backdrop" onclick="closeAllDrawers()" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Product Options Side Drawer -->
    <div id="product-drawer" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white z-50 shadow-2xl drawer transform translate-x-full flex flex-col">
        <!-- Product Drawer Header -->
        <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
            <h2 class="text-sm font-bold text-amber-400 tracking-wide uppercase" id="drawer-title">Product Details</h2>
            <button onclick="closeProductDrawer()" class="text-gray-300 hover:text-white text-2xl font-bold px-2">&times;</button>
        </div>

        <!-- Product Drawer Content -->
        <div class="p-4 flex-grow overflow-y-auto space-y-4">
            <div class="relative bg-gray-50 rounded-lg overflow-hidden border border-gray-200">
                <img id="drawer-image" src="" alt="" class="w-full h-64 object-contain">
                <span id="drawer-code" class="absolute top-2 left-2 bg-amber-500 text-slate-900 text-xs font-bold px-2 py-0.5 rounded shadow"></span>
            </div>

            <div>
                <h3 id="drawer-name" class="font-bold text-base text-slate-900"></h3>
                <p id="drawer-category" class="text-xs text-gray-500 mt-0.5"></p>
            </div>

            <!-- Quantity Selector -->
            <div class="flex items-center justify-between border-t border-b py-3">
                <span class="text-xs font-semibold text-gray-700">Select Quantity:</span>
                <div class="flex items-center gap-3 bg-gray-100 rounded-lg px-3 py-1 border">
                    <button onclick="changeDrawerQty(-1)" class="text-gray-700 font-bold text-base hover:text-amber-600 px-1">-</button>
                    <span id="drawer-qty" class="text-sm font-bold w-6 text-center">1</span>
                    <button onclick="changeDrawerQty(1)" class="text-gray-700 font-bold text-base hover:text-amber-600 px-1">+</button>
                </div>
            </div>
        </div>

        <!-- Product Drawer Actions -->
        <div class="p-4 border-t bg-gray-50 space-y-2">
            <button onclick="addCurrentProductToCart()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg text-xs sm:text-sm flex justify-center items-center gap-2 shadow transition">
                + Add to Cart
            </button>
            
            <button onclick="sendSingleWhatsAppInquiry()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-xs sm:text-sm flex justify-center items-center gap-2 shadow transition">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.285-.143-1.688-.833-1.95-.929-.262-.095-.452-.143-.642.143-.19.285-.736.929-.903 1.119-.166.19-.333.214-.618.071-.285-.143-1.206-.444-2.298-1.418-.849-.758-1.422-1.696-1.588-1.981-.166-.285-.018-.439.125-.581.128-.127.285-.333.428-.499.143-.167.19-.285.285-.476.095-.19.048-.357-.024-.5-.071-.143-.642-1.545-.88-2.116-.232-.557-.468-.482-.642-.491l-.547-.008c-.19 0-.5.071-.761.357-.261.285-.999.976-.999 2.38 0 1.404 1.023 2.76 1.166 2.951.143.19 2.012 3.073 4.876 4.308.681.293 1.213.468 1.627.599.684.218 1.306.187 1.798.114.549-.082 1.688-.69 1.926-1.356.237-.666.237-1.237.166-1.356-.07-.118-.261-.19-.546-.333z"/>
                </svg>
                Inquire This Item on WhatsApp
            </button>
        </div>
    </div>

    <!-- Slide-over Cart Drawer -->
    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white z-50 shadow-2xl drawer transform translate-x-full flex flex-col">
        <!-- Cart Header -->
        <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
            <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wide">Selected Items (<span id="drawer-cart-count">0</span>)</h2>
            <button onclick="toggleCart()" class="text-gray-300 hover:text-white text-2xl font-bold px-2">&times;</button>
        </div>

        <!-- Cart Items List -->
        <div id="cart-items" class="p-4 flex-grow overflow-y-auto divide-y divide-gray-200">
            <!-- Cart items rendered here -->
        </div>

        <!-- Cart Footer / WhatsApp Button -->
        <div class="p-4 border-t bg-gray-50">
            <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 sm:py-3 rounded-lg flex justify-center items-center gap-2 shadow transition text-xs sm:text-sm">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.285-.143-1.688-.833-1.95-.929-.262-.095-.452-.143-.642.143-.19.285-.736.929-.903 1.119-.166.19-.333.214-.618.071-.285-.143-1.206-.444-2.298-1.418-.849-.758-1.422-1.696-1.588-1.981-.166-.285-.018-.439.125-.581.128-.127.285-.333.428-.499.143-.167.19-.285.285-.476.095-.19.048-.357-.024-.5-.071-.143-.642-1.545-.88-2.116-.232-.557-.468-.482-.642-.491l-.547-.008c-.19 0-.5.071-.761.357-.261.285-.999.976-.999 2.38 0 1.404 1.023 2.76 1.166 2.951.143.19 2.012 3.073 4.876 4.308.681.293 1.213.468 1.627.599.684.218 1.306.187 1.798.114.549-.082 1.688-.69 1.926-1.356.237-.666.237-1.237.166-1.356-.07-.118-.261-.19-.546-.333z"/>
                </svg>
                Inquire All Items on WhatsApp
            </button>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
